name: F18 Public Game Catalog Quality Gate

on:
  push:
    branches:
      - main
      - phase/f18-public-game-catalog
    paths:
      - "src/routes/games.index.tsx"
      - "src/components/games/game-catalog-page.tsx"
      - "src/lib/game-catalog-*.ts"
      - "package.json"
      - "PROJECT_CONTINUITY.md"
      - "docs/ROUTE_COMPLIANCE_REGISTRY.md"
      - "docs/workstreams/F18_*"
      - ".github/workflows/f18-public-game-catalog-quality.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/routes/games.index.tsx"
      - "src/components/games/game-catalog-page.tsx"
      - "src/lib/game-catalog-*.ts"
      - "package.json"
      - "PROJECT_CONTINUITY.md"
      - "docs/ROUTE_COMPLIANCE_REGISTRY.md"
      - "docs/workstreams/F18_*"
      - ".github/workflows/f18-public-game-catalog-quality.yml"

permissions:
  contents: read

jobs:
  game-catalog-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Game catalog contract checks
        run: bun run src/lib/game-catalog-contract.spec.ts

      - name: Production build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: SSR, SEO, navigation and responsive evidence
        shell: bash
        env:
          VITE_DATA_ADAPTER: mock
        run: |
          set -Eeuo pipefail

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$CHROME" ]]; then
            echo "A Chromium-compatible browser is required for F18 visual QA."
            exit 1
          fi

          mkdir -p artifacts/f18-game-catalog-qa
          bun run dev -- --host 127.0.0.1 --port 4176 > /tmp/turnoment-f18.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          BASE_URL="http://127.0.0.1:4176/games"
          READY=0
          for _ in $(seq 1 30); do
            if curl -fsS "$BASE_URL" > artifacts/f18-game-catalog-qa/base.html; then
              READY=1
              break
            fi
            sleep 1
          done
          if [[ "$READY" != "1" ]]; then
            cat /tmp/turnoment-f18.log || true
            exit 1
          fi

          BASE_HTML="artifacts/f18-game-catalog-qa/base.html"

          grep -a -q "بازی‌های مسابقات گیمینگ" "$BASE_HTML"
          grep -a -q "بازی‌های مسابقات گیمینگ حضوری | Turnoment" "$BASE_HTML"
          grep -a -q 'name="robots" content="index,follow"' "$BASE_HTML"
          grep -a -q 'rel="canonical" href="/games"' "$BASE_HTML"
          grep -a -q "EA FC 26" "$BASE_HTML"
          grep -a -q "Counter-Strike 2" "$BASE_HTML"
          grep -a -q "/games/ea-fc-26" "$BASE_HTML"
          grep -a -q "game=eafc26" "$BASE_HTML"
          grep -a -q "/tournaments" "$BASE_HTML"
          grep -a -q "/centers" "$BASE_HTML"
          grep -a -q "/ranking" "$BASE_HTML"

          if grep -a -q "ایران مهر افزار\|iranmehrafzar\.ir\|بک‌اند\|API\|mock\|placeholder\|به‌زودی فعال می‌شود" "$BASE_HTML"; then
            echo "Legacy brand or implementation-stage copy must not exist in F18 SSR."
            exit 1
          fi

          MAIN_COUNT="$(grep -a -o '<main' "$BASE_HTML" | wc -l | tr -d ' ')"
          test "$MAIN_COUNT" -eq 1

          for WIDTH in 375 390 430 768 1024 1440; do
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --window-size="${WIDTH},1800" \
              --screenshot="artifacts/f18-game-catalog-qa/games-${WIDTH}.png" \
              "$BASE_URL" >/dev/null 2>&1
          done

          PNG_COUNT="$(find artifacts/f18-game-catalog-qa -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          test "$PNG_COUNT" -eq 6

      - name: Upload F18 game catalog QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: f18-game-catalog-qa-${{ github.sha }}
          path: artifacts/f18-game-catalog-qa
          if-no-files-found: error
          retention-days: 14
