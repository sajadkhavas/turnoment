name: Frontend Quality Gate

on:
  push:
    branches:
      - main
      - "phase/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Production build and route generation
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Contract checks
        run: bun run test
      - name: Browser smoke and responsive screenshots
        shell: bash
        run: |
          set -Eeuo pipefail

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$CHROME" ]]; then
            echo "A Chromium-compatible browser is required for the frontend visual gate."
            exit 1
          fi

          mkdir -p artifacts/browser-qa
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/turnoment-browser-qa.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          DETAIL_URL="http://127.0.0.1:4173/tournaments/fc26-karaj-champions-cup"
          REGISTER_URL="http://127.0.0.1:4173/tournaments/fc26-karaj-champions-cup/register"
          GAME_URL="http://127.0.0.1:4173/games/ea-fc-26"
          MY_TOURNAMENTS_URL="http://127.0.0.1:4173/dashboard/tournaments"
          MY_MATCHES_URL="http://127.0.0.1:4173/dashboard/matches"
          RESULT_URL="http://127.0.0.1:4173/matches/m-204/result"
          DISPUTE_URL="http://127.0.0.1:4173/matches/m-206/dispute"

          READY=0
          for _ in $(seq 1 30); do
            if curl -fsS "$DETAIL_URL" > /tmp/f01-detail.html; then
              READY=1
              break
            fi
            sleep 1
          done
          if [[ "$READY" != "1" ]]; then
            cat /tmp/turnoment-browser-qa.log || true
            exit 1
          fi

          curl -fsS "$REGISTER_URL" > /tmp/f01-register.html
          curl -fsS "$GAME_URL" > /tmp/f02-game.html
          curl -fsS "$MY_TOURNAMENTS_URL" > /tmp/f03-my-tournaments.html
          curl -fsS "$MY_MATCHES_URL" > /tmp/f04-my-matches.html
          curl -fsS "$RESULT_URL" > /tmp/f05-result-submission.html
          curl -fsS "$DISPUTE_URL" > /tmp/f06-dispute.html
          grep -a -q "جام قهرمانان کرج" /tmp/f01-detail.html
          grep -a -q "ثبت‌نام مسابقه" /tmp/f01-register.html
          grep -a -q "EA FC 26" /tmp/f02-game.html
          grep -a -q "فرمت‌های مسابقات EA FC 26" /tmp/f02-game.html
          grep -a -q "مسابقات من" /tmp/f03-my-tournaments.html
          grep -a -q 'name="robots" content="noindex,nofollow"' /tmp/f03-my-tournaments.html
          grep -a -q "Matchهای من" /tmp/f04-my-matches.html
          grep -a -q 'name="robots" content="noindex,nofollow"' /tmp/f04-my-matches.html
          grep -a -q "ثبت نتیجه Match" /tmp/f05-result-submission.html
          grep -a -q 'name="robots" content="noindex,nofollow"' /tmp/f05-result-submission.html
          grep -a -q "اعتراض به Match" /tmp/f06-dispute.html
          grep -a -q 'name="robots" content="noindex,nofollow"' /tmp/f06-dispute.html

          DETAIL_MAIN_COUNT="$(grep -a -o '<main' /tmp/f01-detail.html | wc -l | tr -d ' ')"
          REGISTER_MAIN_COUNT="$(grep -a -o '<main' /tmp/f01-register.html | wc -l | tr -d ' ')"
          GAME_MAIN_COUNT="$(grep -a -o '<main' /tmp/f02-game.html | wc -l | tr -d ' ')"
          MY_TOURNAMENTS_MAIN_COUNT="$(grep -a -o '<main' /tmp/f03-my-tournaments.html | wc -l | tr -d ' ')"
          MY_MATCHES_MAIN_COUNT="$(grep -a -o '<main' /tmp/f04-my-matches.html | wc -l | tr -d ' ')"
          RESULT_MAIN_COUNT="$(grep -a -o '<main' /tmp/f05-result-submission.html | wc -l | tr -d ' ')"
          DISPUTE_MAIN_COUNT="$(grep -a -o '<main' /tmp/f06-dispute.html | wc -l | tr -d ' ')"
          test "$DETAIL_MAIN_COUNT" -eq 1
          test "$REGISTER_MAIN_COUNT" -eq 1
          test "$GAME_MAIN_COUNT" -eq 1
          test "$MY_TOURNAMENTS_MAIN_COUNT" -eq 1
          test "$MY_MATCHES_MAIN_COUNT" -eq 1
          test "$RESULT_MAIN_COUNT" -eq 1
          test "$DISPUTE_MAIN_COUNT" -eq 1

          for WIDTH in 375 390 430 768 1024 1440; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="${WIDTH},1200" --screenshot="artifacts/browser-qa/detail-${WIDTH}.png" "$DETAIL_URL" >/dev/null 2>&1
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="${WIDTH},1200" --screenshot="artifacts/browser-qa/register-${WIDTH}.png" "$REGISTER_URL" >/dev/null 2>&1
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="${WIDTH},1200" --screenshot="artifacts/browser-qa/game-${WIDTH}.png" "$GAME_URL" >/dev/null 2>&1
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="${WIDTH},1800" --screenshot="artifacts/browser-qa/my-tournaments-${WIDTH}.png" "$MY_TOURNAMENTS_URL" >/dev/null 2>&1
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="${WIDTH},1800" --screenshot="artifacts/browser-qa/my-matches-${WIDTH}.png" "$MY_MATCHES_URL" >/dev/null 2>&1
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="${WIDTH},1800" --screenshot="artifacts/browser-qa/result-submission-${WIDTH}.png" "$RESULT_URL" >/dev/null 2>&1
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="${WIDTH},1800" --screenshot="artifacts/browser-qa/dispute-${WIDTH}.png" "$DISPUTE_URL" >/dev/null 2>&1
          done

          test "$(find artifacts/browser-qa -name '*.png' | wc -l)" -eq 42
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-${{ github.sha }}
          path: artifacts/browser-qa/*.png
          if-no-files-found: error
          retention-days: 14
